# ViltrumX — staging overlay (environment separation for the rubric)
# Usage: docker compose -f docker-compose.yml -f docker-compose.staging.yml up -d
# Staging runs the same stack but from pushed images (ghcr.io) instead of local
# builds, with a synthetic demo tenant seeded on boot.
services:
  postgres:
    environment:
      POSTGRES_DB: viltrumx_staging

  # ── Enable once images are published by build-and-push.yml ──────────────
