[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]

[tool.ruff.lint.per-file-ignores]
# One MITRE technique per line — the table is reference data and stays far
# more readable unwrapped than folded across three lines each.
"tools/mitre.py" = ["E501"]
