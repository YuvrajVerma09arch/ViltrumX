# ViltrumX — local development stack
# Usage: docker compose up -d
# Brings up the four data stores. Backend/frontend services are enabled once
# their implementations land (see the commented blocks at the bottom).
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: viltrumx
      POSTGRES_USER: viltrumx
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-viltrumx_dev}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U viltrumx"]
      interval: 10s
      timeout: 5s
      retries: 5

  neo4j:
    image: neo4j:5-community
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-viltrumx_dev}
      NEO4J_PLUGINS: '["graph-data-science"]'
    ports:
      - "7474:7474"   # browser UI
      - "7687:7687"   # bolt
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgres://viltrumx:${POSTGRES_PASSWORD:-viltrumx_dev}@postgres:5432/viltrumx
      REDIS_URL: redis://redis:6379/0
      NEO4J_URI: bolt://neo4j:7687
      QDRANT_URL: http://qdrant:6333
    command: sh -c "python manage.py migrate && python manage.py seed_demo && daphne -b 0.0.0.0 -p 8000 viltrumx.asgi:application"
    ports: ["8000:8000"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  celery:
    build: ./backend
    command: celery -A viltrumx worker -l info
    env_file: .env
    environment:
      DATABASE_URL: postgres://viltrumx:${POSTGRES_PASSWORD:-viltrumx_dev}@postgres:5432/viltrumx
      REDIS_URL: redis://redis:6379/0
      NEO4J_URI: bolt://neo4j:7687
      QDRANT_URL: http://qdrant:6333
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  orchestrator:
    build: ./orchestrator
    env_file: .env
    environment:
      DJANGO_BASE_URL: http://backend:8000
      REDIS_URL: redis://redis:6379/0
      NEO4J_URI: bolt://neo4j:7687
      QDRANT_URL: http://qdrant:6333
    depends_on:
      redis: { condition: service_healthy }
      backend: { condition: service_started }

  frontend:
    build: ./frontend
    environment:
      VITE_API_URL: http://localhost:8000/api/v1
    ports: ["5173:80"]
    depends_on:
      backend: { condition: service_started }

volumes:
  postgres_data:
  neo4j_data:
  qdrant_data:
