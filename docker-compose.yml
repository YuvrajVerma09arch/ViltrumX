# ViltrumX — local development stack with nginx reverse proxy
# Usage: docker compose up -d
# Routes all traffic through nginx:80
#   - / -> frontend (React SPA)
#   - /api/v1/* -> backend (Django)
#   - /webhooks/* -> backend
#   - /ws/* -> backend (WebSocket)

services:
  nginx:
    image: nginx:alpine
    restart: unless-stopped
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "80:80"
    depends_on:
      - backend
      - frontend
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: viltrumx
      POSTGRES_USER: viltrumx
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-viltrumx_dev}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U viltrumx"]
      interval: 10s
      timeout: 5s
      retries: 5

  neo4j:
    image: neo4j:5-community
    restart: unless-stopped
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-viltrumx_dev}
      NEO4J_PLUGINS: '["graph-data-science"]'
    ports:
      - "127.0.0.1:7474:7474"
      - "127.0.0.1:7687:7687"
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10

  qdrant:
    image: qdrant/qdrant:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

  redis:
    image: redis:7
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://viltrumx:${POSTGRES_PASSWORD:-viltrumx_dev}@postgres:5432/viltrumx
      REDIS_URL: redis://redis:6379/0
      NEO4J_URI: bolt://neo4j:7687
      QDRANT_URL: http://qdrant:6333
      DJANGO_SETTINGS_MODULE: ${DJANGO_SETTINGS_MODULE:-viltrumx.settings.dev}
      PORT: 8000
      RUN_MIGRATIONS: "1"
    # entrypoint.sh collects static, migrates, then execs daphne on $PORT.
    command: /app/entrypoint.sh
    # No ports exposed - nginx proxies to backend:8000
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  celery:
    build: ./backend
    restart: unless-stopped
    command: celery -A viltrumx worker -l info
    env_file: .env
    environment:
      DATABASE_URL: postgres://viltrumx:${POSTGRES_PASSWORD:-viltrumx_dev}@postgres:5432/viltrumx
      REDIS_URL: redis://redis:6379/0
      NEO4J_URI: bolt://neo4j:7687
      QDRANT_URL: http://qdrant:6333
      DJANGO_SETTINGS_MODULE: ${DJANGO_SETTINGS_MODULE:-viltrumx.settings.dev}
      PORT: 8000
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  celery-beat:
    build: ./backend
    restart: unless-stopped
    command: celery -A viltrumx beat -l info
    env_file: .env
    environment:
      DATABASE_URL: postgres://viltrumx:${POSTGRES_PASSWORD:-viltrumx_dev}@postgres:5432/viltrumx
      REDIS_URL: redis://redis:6379/0
      NEO4J_URI: bolt://neo4j:7687
      QDRANT_URL: http://qdrant:6333
      DJANGO_SETTINGS_MODULE: ${DJANGO_SETTINGS_MODULE:-viltrumx.settings.dev}
      PORT: 8000
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  orchestrator:
    build: ./orchestrator
    restart: unless-stopped
    env_file: .env
    environment:
      DJANGO_BASE_URL: http://backend:8000
      REDIS_URL: redis://redis:6379/0
      NEO4J_URI: bolt://neo4j:7687
      QDRANT_URL: http://qdrant:6333
    depends_on:
      redis: { condition: service_healthy }
      backend: { condition: service_started }

  frontend:
    build: ./frontend
    restart: unless-stopped
    environment:
      VITE_API_URL: http://localhost/api/v1  # Via nginx
    # No ports exposed - nginx proxies to frontend:80
    depends_on:
      - backend

volumes:
  postgres_data:
  neo4j_data:
  qdrant_data:
