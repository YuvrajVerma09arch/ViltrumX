name: Orchestrator CI
on:
  pull_request:
    paths: ["orchestrator/**"]
  push:
    branches: [develop, main]
    paths: ["orchestrator/**"]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7
        ports: ["6379:6379"]
      neo4j:
        image: neo4j:5-community
        env:
          NEO4J_AUTH: neo4j/testpassword
        ports: ["7474:7474", "7687:7687"]
        options: >-
          --health-cmd "wget -qO- http://localhost:7474 || exit 1"
          --health-interval 10s --health-timeout 5s --health-retries 10
      qdrant:
        image: qdrant/qdrant:latest
        ports: ["6333:6333"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: orchestrator/requirements.txt
      - name: Install dependencies
        run: pip install -r orchestrator/requirements.txt
      - name: Lint (ruff)
        run: ruff check orchestrator/
      - name: Security scan (bandit)
        run: bandit -r orchestrator/ -ll
      - name: Tests
        env:
          REDIS_URL: redis://localhost:6379/0
          NEO4J_URI: bolt://localhost:7687
          NEO4J_PASSWORD: testpassword
          QDRANT_URL: http://localhost:6333
        run: pytest orchestrator/ --cov=orchestrator --cov-report=xml