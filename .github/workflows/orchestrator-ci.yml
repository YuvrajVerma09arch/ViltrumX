name: Orchestrator CI
on:
  pull_request:
    paths: ["orchestrator/**"]
  push:
    branches: [develop, main]
    paths: ["orchestrator/**"]
jobs:
  test:
    runs-on: ubuntu-latest
    # No service containers: the suite is import / graph-build / state-schema
    # smoke tests, and none of them opens Redis, Neo4j, Qdrant or HTTP
    # connections at import time (all clients are created lazily at runtime).
    # The old Neo4j service was also a startup hazard — its `wget` health
    # probe is not guaranteed to exist in neo4j:5-community.
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: orchestrator/requirements.txt
      - name: Install dependencies
        run: pip install -r orchestrator/requirements.txt
      - name: Lint (ruff)
        run: ruff check orchestrator/
      - name: Security scan (bandit)
        run: bandit -r orchestrator/ -ll
      - name: Tests
        run: pytest orchestrator/ --cov=orchestrator --cov-report=xml
