name: Backend CI
on:
  pull_request:
    paths: ["backend/**"]
  push:
    branches: [develop, main]
    paths: ["backend/**"]
jobs:
  test:
    runs-on: ubuntu-latest
    # Postgres/Redis service containers get enabled together with the test
    # steps below once the Django project lands in backend/.
    steps:
      - uses: actions/checkout@v4
      - name: Detect Django project
        id: django
        run: echo "exists=$([ -f backend/manage.py ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - name: Backend not implemented yet
        if: steps.django.outputs.exists == 'false'
        run: echo "backend/manage.py not found — skipping test suite until Django lands"
      - uses: actions/setup-python@v5
        if: steps.django.outputs.exists == 'true'
        with:
          python-version: "3.12"
      - name: Install dependencies
        if: steps.django.outputs.exists == 'true'
        run: pip install -r backend/requirements.txt
      - name: Lint (ruff)
        if: steps.django.outputs.exists == 'true'
        run: ruff check backend/
      - name: Security scan (bandit)
        if: steps.django.outputs.exists == 'true'
        run: bandit -r backend/ -ll
      - name: Migration check
        if: steps.django.outputs.exists == 'true'
        run: python backend/manage.py migrate --check
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/viltrumx_test
      - name: Tests
        if: steps.django.outputs.exists == 'true'
        run: pytest backend/ --cov=backend --cov-report=xml
