name: Build & Push Images
on:
  push:
    branches: [main]
    tags: ["v*"]
jobs:
  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service: [frontend, backend, orchestrator]
    steps:
      - uses: actions/checkout@v5
      # Docker image tags must be lowercase, but github.repository preserves the
      # username's case (e.g. "YuvrajVerma09arch/ViltrumX"). Compute a lowercase
      # image path once and reuse it for build, push, and the Trivy scan so they
      # can never disagree. Without this every job fails: "repository name must
      # be lowercase".
      - name: Lowercase image path
        id: repo
        run: echo "image=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')/${{ matrix.service }}" >> "$GITHUB_OUTPUT"
      # setup-buildx is required: cache-to: type=gha needs the docker-container
      # driver, but the runner's default builder is the legacy "docker" driver,
      # which can't export cache → "Cache export is not supported for the docker
      # driver". This step creates a docker-container builder and makes it current.
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          push: true
          tags: ${{ steps.repo.outputs.image }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ steps.repo.outputs.image }}:${{ github.sha }}
          severity: CRITICAL,HIGH
