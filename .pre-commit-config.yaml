# Install: pip install pre-commit && pre-commit install
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        files: ^(backend|orchestrator)/
      - id: ruff-format
        files: ^(backend|orchestrator)/
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: check-added-large-files
      - id: detect-private-key
      - id: end-of-file-fixer
  - repo: local
    hooks:
      - id: frontend-lint
        name: Frontend lint (oxlint)
        entry: npx oxlint
        language: system
        types: [typescript, tsx]
        files: ^frontend/
      - id: frontend-type-check
        name: Frontend type-check (tsc)
        entry: npx tsc --noEmit
        language: system
        files: ^frontend/
      - id: frontend-format
        name: Frontend format (prettier)
        entry: npx prettier --write
        language: system
        types: [typescript, tsx, json, css, md]
        files: ^frontend/
